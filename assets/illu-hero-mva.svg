<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" role="img" aria-labelledby="t d">
  <title id="t">Mathematics, vision, learning</title>
  <desc id="d">A smooth curve (mathematics), a pixel grid with a detected contour (vision) and a small layered network (learning).</desc>
  <style>
    .stroke { fill: none; stroke: currentColor; stroke-width: 1.5; opacity: .55; }
    .node { fill: currentColor; opacity: .72; }
    .pix { fill: currentColor; }
    .soft { fill: currentColor; opacity: .16; }
  </style>
  <!-- M: a curve and its tangent -->
  <rect class="soft" x="22" y="34" width="124" height="92" rx="10"/>
  <path class="stroke" d="M32 116 C60 30, 96 30, 136 104"/>
  <path class="stroke" d="M40 64 L120 44" stroke-dasharray="4 3"/>
  <circle class="node" cx="80" cy="54" r="4"/>
  <!-- V: pixel grid with a contour -->
  <rect class="soft" x="178" y="34" width="124" height="92" rx="10"/>
  <g>
    <rect class="pix" x="196" y="46" width="16" height="16" opacity=".15"/><rect class="pix" x="214" y="46" width="16" height="16" opacity=".30"/><rect class="pix" x="232" y="46" width="16" height="16" opacity=".55"/><rect class="pix" x="250" y="46" width="16" height="16" opacity=".30"/><rect class="pix" x="268" y="46" width="16" height="16" opacity=".15"/>
    <rect class="pix" x="196" y="64" width="16" height="16" opacity=".30"/><rect class="pix" x="214" y="64" width="16" height="16" opacity=".60"/><rect class="pix" x="232" y="64" width="16" height="16" opacity=".80"/><rect class="pix" x="250" y="64" width="16" height="16" opacity=".60"/><rect class="pix" x="268" y="64" width="16" height="16" opacity=".30"/>
    <rect class="pix" x="196" y="82" width="16" height="16" opacity=".15"/><rect class="pix" x="214" y="82" width="16" height="16" opacity=".30"/><rect class="pix" x="232" y="82" width="16" height="16" opacity=".55"/><rect class="pix" x="250" y="82" width="16" height="16" opacity=".30"/><rect class="pix" x="268" y="82" width="16" height="16" opacity=".15"/>
  </g>
  <ellipse class="stroke" cx="240" cy="72" rx="34" ry="22"/>
  <!-- A: a small layered network -->
  <rect class="soft" x="334" y="34" width="124" height="92" rx="10"/>
  <path class="stroke" d="M352 56 L396 48 M352 56 L396 80 M352 56 L396 112 M352 104 L396 48 M352 104 L396 80 M352 104 L396 112 M396 48 L440 80 M396 80 L440 80 M396 112 L440 80"/>
  <circle class="node" cx="352" cy="56" r="5"/><circle class="node" cx="352" cy="104" r="5"/>
  <circle class="node" cx="396" cy="48" r="5"/><circle class="node" cx="396" cy="80" r="5"/><circle class="node" cx="396" cy="112" r="5"/>
  <circle class="node" cx="440" cy="80" r="6"/>
</svg>
