<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d">
  <title id="t">Epipolar geometry of two views</title>
  <desc id="d">Two camera centres C and C' joined by the baseline, a scene point X, the epipolar plane through C, C' and X, the image points x and x', the epipoles e and e' where the baseline crosses the image planes, and the epipolar lines through them.</desc>
  <rect x="0" y="0" width="760" height="380" fill="#ffffff"/>
  <!-- epipolar plane -->
  <polygon points="110,300 650,300 380,60" fill="#fbe9c8" stroke="#7a5200" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- image planes -->
  <polygon points="170,110 262,140 262,345 170,315" fill="#dfe9f7" fill-opacity="0.85" stroke="#1f3f73" stroke-width="2.5"/>
  <polygon points="498,140 590,110 590,315 498,345" fill="#dfe9f7" fill-opacity="0.85" stroke="#1f3f73" stroke-width="2.5"/>
  <!-- rays and baseline -->
  <g stroke="#222" stroke-width="2.5" fill="none">
    <line x1="110" y1="300" x2="380" y2="60"/>
    <line x1="650" y1="300" x2="380" y2="60"/>
    <line x1="110" y1="300" x2="650" y2="300"/>
  </g>
  <!-- epipolar lines -->
  <g stroke="#b3261e" stroke-width="4" fill="none">
    <line x1="237" y1="163" x2="200" y2="323"/>
    <line x1="523" y1="163" x2="560" y2="323"/>
  </g>
  <!-- points -->
  <g fill="#111">
    <circle cx="110" cy="300" r="6"/>
    <circle cx="650" cy="300" r="6"/>
    <circle cx="380" cy="60" r="6"/>
  </g>
  <g fill="#ffffff" stroke="#111" stroke-width="2.5">
    <circle cx="230" cy="193" r="6"/>
    <circle cx="530" cy="193" r="6"/>
    <circle cx="205" cy="300" r="6"/>
    <circle cx="555" cy="300" r="6"/>
  </g>
  <!-- labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#111">
    <text x="88" y="326">C</text>
    <text x="660" y="326">C′</text>
    <text x="392" y="56">X (scene point)</text>
    <text x="244" y="200">x</text>
    <text x="504" y="200">x′</text>
    <text x="182" y="296">e</text>
    <text x="565" y="296">e′</text>
    <text x="300" y="322">baseline</text>
    <text x="318" y="250">epipolar plane</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#b3261e">
    <text x="84" y="250">l = Fᵀx′</text>
    <text x="600" y="250">l′ = F x</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f3f73">
    <text x="170" y="100">image 1</text>
    <text x="530" y="100">image 2</text>
  </g>
</svg>
