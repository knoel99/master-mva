<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="t d">
  <title id="t">The processing chain of a camera</title>
  <desc id="d">Capture by lens and sensor, raw-domain blocks, RGB-domain blocks, and the 3A control loops.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="840" height="330" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111" text-anchor="middle">
    <!-- Row 1: capture -->
    <g stroke="#333" stroke-width="2.5" fill="#ececec">
      <rect x="21" y="32" width="100" height="48" rx="6"/>
      <rect x="160" y="32" width="140" height="48" rx="6"/>
      <rect x="340" y="32" width="220" height="48" rx="6"/>
    </g>
    <text x="71" y="61">Scene</text>
    <text x="230" y="53">Lens</text><text x="230" y="70">ch. 1</text>
    <text x="450" y="53">Sensor + colour filters</text><text x="450" y="70">ch. 2</text>
    <g stroke="#222" stroke-width="2" fill="none" marker-end="url(#a)">
      <line x1="121" y1="56" x2="156" y2="56"/>
      <line x1="300" y1="56" x2="336" y2="56"/>
    </g>
    <!-- 3A box -->
    <rect x="610" y="32" width="210" height="48" rx="6" fill="#f6efe0" stroke="#7a5200" stroke-width="2.5" stroke-dasharray="7 4"/>
    <text x="715" y="53">3A loops: exposure,</text><text x="715" y="70">focus, white balance</text>
    <g stroke="#7a5200" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#a)">
      <line x1="610" y1="56" x2="564" y2="56"/>
      <polyline points="715,32 715,14 230,14 230,28"/>
      <polyline points="760,148 760,84"/>
    </g>
    <text x="800" y="120" fill="#7a5200" font-size="12">statistics</text>
    <!-- connector to row 2 -->
    <polyline points="450,80 450,104 80,104 80,144" stroke="#222" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="265" y="98" font-size="12" font-style="italic">raw mosaic</text>
    <!-- Row 2: raw domain -->
    <g stroke="#1f4e8c" stroke-width="2.5" fill="#dbe8f7">
      <rect x="21" y="148" width="118" height="52" rx="6"/>
      <rect x="157" y="148" width="118" height="52" rx="6"/>
      <rect x="293" y="148" width="118" height="52" rx="6"/>
      <rect x="429" y="148" width="118" height="52" rx="6"/>
      <rect x="565" y="148" width="118" height="52" rx="6"/>
      <rect x="701" y="148" width="118" height="52" rx="6"/>
    </g>
    <text x="80" y="179">Black level</text>
    <text x="216" y="171">Defective</text><text x="216" y="188">pixels</text>
    <text x="352" y="171">Lens</text><text x="352" y="188">shading</text>
    <text x="488" y="171">White</text><text x="488" y="188">balance</text>
    <text x="624" y="171">Raw denoising</text><text x="624" y="188">ch. 4</text>
    <text x="760" y="171">Demosaicing</text><text x="760" y="188">ch. 3</text>
    <g stroke="#222" stroke-width="2" fill="none" marker-end="url(#a)">
      <line x1="139" y1="174" x2="153" y2="174"/>
      <line x1="275" y1="174" x2="289" y2="174"/>
      <line x1="411" y1="174" x2="425" y2="174"/>
      <line x1="547" y1="174" x2="561" y2="174"/>
      <line x1="683" y1="174" x2="697" y2="174"/>
    </g>
    <text x="420" y="222" font-size="12" font-style="italic">bursts, HDR and multi-frame super-resolution merge raw frames here (ch. 5–6)</text>
    <!-- connector to row 3 -->
    <polyline points="760,200 760,234 96,234 96,256" stroke="#222" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <!-- Row 3: RGB domain -->
    <g stroke="#2e6b2e" stroke-width="2.5" fill="#dcefdc">
      <rect x="26" y="260" width="140" height="52" rx="6"/>
      <rect x="188" y="260" width="140" height="52" rx="6"/>
      <rect x="350" y="260" width="140" height="52" rx="6"/>
      <rect x="512" y="260" width="140" height="52" rx="6"/>
    </g>
    <text x="96" y="283">Colour matrix</text><text x="96" y="300">ch. 3</text>
    <text x="258" y="283">Tone curve</text><text x="258" y="300">ch. 3, ch. 5</text>
    <text x="420" y="283">Sharpening</text><text x="420" y="300">ch. 3</text>
    <text x="582" y="283">JPEG / HEIF</text><text x="582" y="300">file</text>
    <rect x="674" y="260" width="146" height="52" rx="6" fill="#ffffff" stroke="#333" stroke-width="2.5" stroke-dasharray="7 4"/>
    <text x="747" y="283">Quality evaluation</text><text x="747" y="300">ch. 7</text>
    <g stroke="#222" stroke-width="2" fill="none" marker-end="url(#a)">
      <line x1="166" y1="286" x2="184" y2="286"/>
      <line x1="328" y1="286" x2="346" y2="286"/>
      <line x1="490" y1="286" x2="508" y2="286"/>
      <line x1="652" y1="286" x2="670" y2="286"/>
    </g>
  </g>
</svg>
